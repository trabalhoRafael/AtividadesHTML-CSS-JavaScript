<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css" >
    <script src="script.js"></script>
</head>
<body>
    <div class="container">
        <h1 id="form-title">Cadastrar Animal</h1>
        
        <form id="CadAnimal" onsubmit="salvarAnimal(event)">
            <input type="hidden" id="amnId" value="">

            <div class="form-group">
                <label for="nome">Nome do animal:</label>
                <input type="text" id="nome" required placeholder="">
            </div>

            <div class="form-group">
                <label for="especie">Especie:</label>
                <input type="text" id="especie" required placeholder="">
            </div>

            <div class="form-group">
                <label for="idade">idade:</label>
                <input type="number" id="idade" required min="1" max="100" placeholder="">
            </div>

            <div class="form-group">
                <label for="peso">Peso do animal (kg):</label>
                <input type="number" id="peso" required step="0.1" min="1" placeholder="Ex: 910">
            </div>

            <div class="btn-group">
                <button type="submit" class="btn-save" id="btnSubmit">Salvar</button>
            </div>
        </form>

        <hr>

        <h2>Lista de Animais Registrados</h2>
        <table>
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Especie</th>
                    <th>Idade</th>
                    <th>Peso (kg)</th>
                    <th style="width: 150px;">Ações</th>
                </tr>
            </thead>
            <tbody id="tableBody">
            </tbody>
        </table>
    </div>

    
</body>
</html>
