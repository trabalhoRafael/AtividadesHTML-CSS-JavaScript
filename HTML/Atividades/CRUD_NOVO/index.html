
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Usuário Externo</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- CABEÇALHO -->
    <header class="cabecalho">

        <div class="instituicao">
            UNIVERSIDADE FEDERAL DOS VALES DO JEQUITINHONHA E MUCURI
        </div>

        <div class="logo">
            sei!
        </div>

    </header>

    <main class="container">

        <h1>Cadastro de Usuário Externo</h1>

        <!-- DADOS CADASTRAIS -->
        <section>

            <h2>Dados Cadastrais</h2>

            <div class="dados_cadastrais">

                <div class="campo largura-total">
                    <label for="nome">Nome do Representante:</label>
                    <input type="text" id="nome">
                </div>

                <div class="campo">
                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf">
                </div>

                <div class="campo">
                    <label for="rg">RG:</label>
                    <input type="text" id="rg">
                </div>

                <div class="campo">
                    <label for="orgao_expedidor">Órgão Expedidor:</label>
                    <input type="text" id="orgao_expedidor">
                </div>

                <div class="campo">
                    <label for="telefone_fixo">Telefone Fixo:</label>
                    <input type="tel" id="telefone_fixo">
                </div>

                <div class="campo">
                    <label for="telefone_celular">Telefone Celular:</label>
                    <input type="tel" id="telefone_celular">
                </div>

                <div class="campo largura-total">
                    <label for="endereco_residencial">Endereço Residencial:</label>
                    <input type="text" id="endereco_residencial">
                </div>

                <div class="campo campo-duplo">
                    <label for="complemento">Complemento:</label>
                    <input type="text" id="complemento">
                </div>

                <div class="campo">
                    <label for="bairro">Bairro:</label>
                    <input type="text" id="bairro">
                </div>

                <div class="campo">
                    <label for="estado">Estado:</label>
                    <select id="estado">
                        <option value="">Selecione o estado</option>

                        <option value="AC">Acre</option>
                        <option value="AL">Alagoas</option>
                        <option value="AP">Amapá</option>
                        <option value="AM">Amazonas</option>
                        <option value="BA">Bahia</option>
                        <option value="CE">Ceará</option>
                        <option value="DF">Distrito Federal</option>
                        <option value="ES">Espírito Santo</option>
                        <option value="GO">Goiás</option>
                        <option value="MA">Maranhão</option>
                        <option value="MT">Mato Grosso</option>
                        <option value="MS">Mato Grosso do Sul</option>
                        <option value="MG">Minas Gerais</option>
                        <option value="PA">Pará</option>
                        <option value="PB">Paraíba</option>
                        <option value="PR">Paraná</option>
                        <option value="PE">Pernambuco</option>
                        <option value="PI">Piauí</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="RN">Rio Grande do Norte</option>
                        <option value="RS">Rio Grande do Sul</option>
                        <option value="RO">Rondônia</option>
                        <option value="RR">Roraima</option>
                        <option value="SC">Santa Catarina</option>
                        <option value="SP">São Paulo</option>
                        <option value="SE">Sergipe</option>
                        <option value="TO">Tocantins</option>
                    </select>
                </div>

                <div class="campo campo-duplo">
                    <label for="cidade">Cidade:</label>
                    <input type="text" id="cidade">
                </div>

                <div class="campo">
                    <label for="cep">CEP:</label>
                    <input type="text" id="cep">
                </div>

            </div>

        </section>

        <!-- DADOS DE AUTENTICAÇÃO -->
        <section>

            <h2>Dados de Autenticação</h2>

            <div class="dados_autenticacao">

                <div class="campo">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email">
                </div>

                <div class="campo">
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha">
                </div>

                <div class="campo">
                    <label for="confirmar_senha">Confirmar Senha:</label>
                    <input type="password" id="confirmar_senha">
                </div>

            </div>

        </section>

        <!-- BOTÕES -->
        <div class="botoes">

            <button type="submit">Enviar</button>
            <button type="reset">Voltar</button>

        </div>

    </main>
    <script src="script.js"></script>


</body>

</html>
